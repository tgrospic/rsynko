name: 📦 Rsynko binary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    name: 📦 Build binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.97'

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: 🚀 Run release build
      run: cargo build --release --locked -p rsynko

    - name: 🔨 State the archive
      # The name says what it is and what it runs on, so several of them can rest side by side on
      # one release page.
      run: |
        install -Dm755 target/release/rsynko "rsynko-x86_64-unknown-linux-gnu/rsynko"
        install -Dm644 LICENSE "rsynko-x86_64-unknown-linux-gnu/LICENSE"
        install -Dm644 README.md "rsynko-x86_64-unknown-linux-gnu/README.md"
        tar -czf rsynko-x86_64-unknown-linux-gnu.tar.gz rsynko-x86_64-unknown-linux-gnu
        sha256sum rsynko-x86_64-unknown-linux-gnu.tar.gz > rsynko-x86_64-unknown-linux-gnu.tar.gz.sha256

    - name: 🔨 Keep the archive with the build
      uses: actions/upload-artifact@v7
      with:
        name: rsynko-x86_64-unknown-linux-gnu
        path: |
          rsynko-x86_64-unknown-linux-gnu.tar.gz
          rsynko-x86_64-unknown-linux-gnu.tar.gz.sha256
        retention-days: 14

    - name: 📦 Attach the archive to the release
      # Every crate is tagged `<crate>-v<version>`, so the executable's own tag is the release.
      if: startsWith(github.ref, 'refs/tags/rsynko-v')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          rsynko-x86_64-unknown-linux-gnu.tar.gz
          rsynko-x86_64-unknown-linux-gnu.tar.gz.sha256
