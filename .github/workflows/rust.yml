name: 🔧 Rsynko build and test

on:
  push:
    branches:
    - master
    tags: '**'
  pull_request:
    branches:
    - master
    - 'feature/**'
    - 'release/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 🔧 Rsynko checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.97'
        components: clippy,rustfmt

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Setup just
      uses: extractions/setup-just@v4

    - name: 🔨 Run formatting check
      run: just fmt

    - name: 🚀 Run build
      run: just build

    - name: 🔨 Run clippy check
      run: just clippy

    - name: 🔨 Run docs generator
      run: just doc

    - name: 🚦 Run tests
      run: RUST_BACKTRACE=1 just test

    - name: 📦 Run package check
      run: just package
