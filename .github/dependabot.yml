version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    labels:
    - dependencies

updates:
- package-ecosystem: cargo
  directory: /
  patterns:
  - "*"
  multi-ecosystem-group: dependencies
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  directory: /
  patterns:
  - "*"
  multi-ecosystem-group: dependencies
  cooldown:
    default-days: 7
